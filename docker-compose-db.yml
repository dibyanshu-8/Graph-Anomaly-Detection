version: '3.8'
services:
  neo4j:
    image: neo4j:5.10
    ports:
      - "7474:7474"  # Browser UI
      - "7687:7687"  # App connection
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  neo4j_data:
  redis_data: